name: Verify and build portfolio source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          package-json-file: source/package.json
          cache: true
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Verify production source
        run: pnpm run verify
